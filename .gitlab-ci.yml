# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/ee/user/application_security/secret_detection/#customizing-settings
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence
#
# Deployment behavior:
#
# * Push to dev branch -> run 'sast' and 'runTests' stages
# * Create MR for dev into main -> run no stages
# * Merge MR into main branch -> run 'build' and 'deployToTest' stages
# * Create MR for main into release -> run no stages
# * Merge MR into release branch -> run 'build' and 'deployToProd' stages
#
stages:
- test
- runTests
- build
- deployToTest
- deployToProd
runTests:
  stage: runTests
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
  script:
  - composer install -ovn
  - cp .env.example .env
  - cp compose.yml.example compose.yml
  - cp docker.env.example docker.env
  - sed -i'' 's/WWWUSER=1000/WWWUSER=1001/' docker.env
  - sed -i'' 's/WWWGROUP=1000/WWWGROUP=1001/' docker.env
  - npm i
  - npm run build
  - ./vendor/bin/sail up -d
  - ./vendor/bin/sail artisan key:generate
  - ./vendor/bin/sail artisan migrate --seed
  - ./vendor/bin/sail artisan test
  - ./vendor/bin/sail down
  - sudo /usr/bin/chown -R deployment:deployment *
  tags:
  - wxnotify-docker
build:
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME =~ /(main|release)/'
  script:
  - composer install --prefer-dist --no-scripts -v -o
  - npm i
  - npm run build
  after_script:
  - echo "BUILD_JOB_ID=$CI_JOB_ID" >> job.env
  artifacts:
    reports:
      dotenv: job.env
    paths:
    - ./
    exclude:
    - .git
    - .git/**/*
    expire_in: 1 day
  tags:
  - wxnotify-docker
deployToTest:
  stage: deployToTest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME == "main"'
  script:
  - which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )
  - eval $(ssh-agent -s)
  - ssh-add <(echo "$SSH_PRIVATE_KEY")
  - mkdir -p ~/.ssh
  - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  - composer install --prefer-dist --no-scripts -v -o
  - ./vendor/bin/envoy run deploy --commit="$CI_COMMIT_SHA" --token="$GITLAB_TOKEN"
    --job="$BUILD_JOB_ID" --project="$CI_PROJECT_ID" --env=test
  environment:
    name: test
    url: https://nwwsoi-controller1.test.wxnotify.com
  tags:
  - wxnotify-docker
deployToProd:
  stage: deployToProd
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME == "release"'
  script:
  - which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )
  - eval $(ssh-agent -s)
  - ssh-add <(echo "$SSH_PRIVATE_KEY")
  - mkdir -p ~/.ssh
  - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  - composer install --prefer-dist --no-scripts -v -o
  - ./vendor/bin/envoy run deploy --commit="$CI_COMMIT_SHA" --token="$GITLAB_TOKEN"
    --job="$BUILD_JOB_ID" --project="$CI_PROJECT_ID" --env=prod
  environment:
    name: prod
    url: https://nwwsoi-controller1.wxnotify.com
  tags:
  - wxnotify-docker
include:
- template: Jobs/SAST.gitlab-ci.yml
- template: Jobs/Secret-Detection.gitlab-ci.yml
#- template: Security/SAST-IaC.gitlab-ci.yml
#- template: Security/Dependency-Scanning.gitlab-ci.yml
variables:
  SAST_EXCLUDED_ANALYZERS: "nodejs-scan,semgrep,eslint"
